{{- if .Values.existingSecret }}
{{- range $id, $st := .Values.stations }}
{{- if ($st | default dict).refreshToken }}
{{- fail (printf "stations.%s.refreshToken is ignored with existingSecret: put BLUETTI_%s_REFRESH_TOKEN into that Secret" $id (upper $id)) }}
{{- end }}
{{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bgb.fullname" . }}
  labels:
    {{- include "bgb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- range $id, $st := .Values.stations }}
  {{- with ($st | default dict).refreshToken }}
  BLUETTI_{{ upper $id }}_REFRESH_TOKEN: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
