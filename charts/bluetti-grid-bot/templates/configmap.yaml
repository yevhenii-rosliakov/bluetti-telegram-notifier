apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bgb.fullname" . }}
  labels:
    {{- include "bgb.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
  {{- include "bgb.validateStations" . }}
  {{- if and .Values.stations (not .Values.config.BLUETTI_STATIONS) }}
  BLUETTI_STATIONS: {{ keys .Values.stations | sortAlpha | join "," | quote }}
  {{- end }}
  {{- range $id, $st := .Values.stations }}
  {{- $st = $st | default dict }}
  {{- $prefix := printf "BLUETTI_%s_" (upper $id) }}
  {{- with $st.name }}
  {{ $prefix }}NAME: {{ . | toString | quote }}
  {{- end }}
  {{- with $st.gateway }}
  {{ $prefix }}GATEWAY: {{ . | toString | quote }}
  {{- end }}
  {{- with $st.deviceSns }}
  {{- if kindIs "slice" . }}
  {{ $prefix }}DEVICE_SNS: {{ join "," . | quote }}
  {{- else }}
  {{ $prefix }}DEVICE_SNS: {{ . | toString | quote }}
  {{- end }}
  {{- end }}
  {{- with $st.schedule }}
  {{- with .provider }}
  {{ $prefix }}SCHEDULE_PROVIDER: {{ . | toString | quote }}
  {{- end }}
  {{- with .region }}
  {{ $prefix }}SCHEDULE_REGION: {{ . | toString | quote }}
  {{- end }}
  {{- with .group }}
  {{ $prefix }}SCHEDULE_GROUP: {{ . | toString | quote }}
  {{- end }}
  {{- if hasKey . "warnMinutes" }}
  {{- if kindIs "slice" .warnMinutes }}
  {{ $prefix }}SCHEDULE_WARN_MINUTES: {{ join "," .warnMinutes | quote }}
  {{- else }}
  {{ $prefix }}SCHEDULE_WARN_MINUTES: {{ .warnMinutes | toString | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  STATE_DIR: /data
  HTTP_PORT: {{ .Values.httpPort | toString | quote }}
  METRICS_ENABLED: {{ .Values.metrics.enabled | toString | quote }}
